<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Celestial Union | Dina & Heri</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0a0a0a;
            --gold: #e2c08d;
            --gold-bright: #ffedbc;
            --soft-pink: #fde2e4;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(226, 192, 141, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            perspective: 1000px;
            height: 100vh;
        }

        /* CUSTOM CURSOR */
        #cursor {
            width: 20px; height: 20px;
            background: var(--gold);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transition: transform 0.1s;
        }

        /* BACKGROUND ENGINE */
        #canvas-stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
        }

        /* LAYOUT */
        section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* CONTENT CARD 3D */
        .perspective-container {
            width: 100%;
            max-width: 650px;
            transform-style: preserve-3d;
            transition: transform 0.5s ease-out;
        }

        .main-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 40px;
            position: relative;
            transform: translateZ(50px);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
        }

        .card-inner {
            position: relative;
            z-index: 2;
            background: rgba(10, 10, 10, 0.85);
            border-radius: 30px;
            padding: 35px;
            text-align: center;
        }

        /* TYPOGRAPHY */
        .title-gold {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 3.8rem);
            background: linear-gradient(to right, var(--gold), var(--gold-bright), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--soft-pink);
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .warm-wish {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            line-height: 1.7;
            color: #d1d1d1;
            font-style: italic;
            margin-bottom: 30px;
        }

        /* PREMIUM TEXT AREA INPUT */
        .input-section {
            margin-top: 20px;
            text-align: left;
        }

        .input-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 8px;
            display: block;
            font-weight: 600;
        }

        .premium-textbox {
            width: 100%;
            height: 100px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(226, 192, 141, 0.2);
            border-radius: 15px;
            padding: 15px;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
        }

        .premium-textbox:focus {
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(226, 192, 141, 0.1);
        }

        .premium-textbox::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-style: italic;
        }

        /* LUXURY BUTTON */
        .btn-holder {
            margin-top: 25px;
            text-align: center;
        }

        .btn-send {
            background: linear-gradient(135deg, #e2c08d 0%, #ffedbc 100%);
            color: #000;
            border: none;
            padding: 16px 45px;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            z-index: 10;
        }

        .btn-send:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 30px rgba(226, 192, 141, 0.3);
        }

        /* CELESTIAL LANTERN / DOAL BALLOON */
        .flying-prayer {
            position: fixed;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,237,188,1) 0%, rgba(226,192,141,0.85) 40%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            font-style: italic;
            box-shadow: 0 0 60px rgba(255, 237, 188, 0.7), inset 0 0 20px rgba(255,255,255,0.5);
            z-index: 100;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.1);
            text-align: center;
            padding: 25px;
        }

        .flying-prayer span {
            font-size: 0.85rem;
            color: #1a1a1a;
            max-width: 85%;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Membatasi teks panjang di dalam balon maksimal 3 baris agar tetap estetik */
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(255,255,255,0.6);
        }

        /* TIMING ANIMASI YANG LIAR & SINEMATIK (Total 8 Detik) */
        @keyframes ascend {
            0% {
                transform: translate(-50%, -50%) scale(0.2);
                opacity: 0;
                filter: blur(5px);
            }
            /* Detik 0.8 - 4.0: Balon menetap di tempat, membesar, dan bergetar halus (fase meresapi doa) */
            10% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
                filter: blur(0px);
            }
            30% {
                transform: translate(-50%, calc(-50% - 10px)) scale(1.03) rotate(2deg);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, calc(-50% + 5px)) scale(0.98) rotate(-2deg);
                opacity: 1;
            }
            /* Detik 4.0 - 8.0: Balon mulai meluncur naik secara perlahan, menembus atmosfer */
            60% {
                transform: translate(-50%, calc(-50% - 30px)) scale(1) rotate(0deg);
                opacity: 1;
                filter: blur(0px);
            }
            90% {
                opacity: 0.8;
                filter: blur(2px);
            }
            100% {
                transform: translate(-50%, -150vh) scale(1.8) rotate(25deg);
                opacity: 0;
                filter: blur(6px);
            }
        }

        @media (max-width: 600px) {
            .main-card { padding: 15px; border-radius: 25px; }
            .card-inner { padding: 20px; border-radius: 20px; }
            .title-gold { font-size: 2.3rem; }
        }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <canvas id="canvas-stars"></canvas>

    <section>
        <div class="perspective-container" id="tilt-card">
            <div class="main-card">
                <div class="card-inner">
                    <p class="subtitle">A Journey of Soul</p>
                    <h1 class="title-gold">Dina & Heri</h1>
                    <div style="height: 1px; width: 60px; background: var(--gold); margin: 0 auto 25px auto;"></div>
                    
                    <div class="warm-wish">
                        "Di semesta yang maha luas, dua jiwa akhirnya menemukan rumahnya. <br>
                        Semoga pernikahan ini menjadi orkestra paling indah yang pernah dimainkan takdir."
                    </div>

                    <!-- REPLACED SIGNATURE WITH PREMIUM TEXTAREA -->
                    <div class="input-section">
                        <label class="input-label">Tulis Doa & Harapan Anda</label>
                        <textarea class="premium-textbox" id="prayer-input" placeholder="Tulis sesuatu yang menyentuh hati di sini..."></textarea>
                    </div>

                    <div class="btn-holder">
                        <button class="btn-send" id="btn-submit">Terbangkan Doa</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FLOATING PRAYER ELEMENT GENERATOR TEMPLATE -->
    <div class="flying-prayer" id="prayer-balloon"><span></span></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        // 1. DYNAMIC STAR SYSTEM
        const canvas = document.getElementById('canvas-stars');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speed: Math.random() * 0.3 + 0.1
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
                p.y -= p.speed;
                if(p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(drawStars);
        }
        window.addEventListener('resize', initStars);
        initStars(); drawStars();

        // 2. KINETIC CURSOR & 3D TILT EFFECT
        const card = document.getElementById('tilt-card');
        const cursor = document.getElementById('cursor');

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 35;
            const y = (window.innerHeight / 2 - e.pageY) / 35;
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
            
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 3. ASCENDING PRAYER BALLOON ANIMATION ENGINE
        const btnSubmit = document.getElementById('btn-submit');
        const prayerInput = document.getElementById('prayer-input');

        btnSubmit.addEventListener('click', (e) => {
            const text = prayerInput.value.trim();
            if (text === "") {
                alert("Mohon ketikkan doa Anda terlebih dahulu sebelum menerbangkannya.");
                return;
            }

            const btnRect = btnSubmit.getBoundingClientRect();
            const balloon = document.createElement('div');
            balloon.className = 'flying-prayer';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = text;
            balloon.appendChild(textSpan);

            // Ukuran balon ideal agar tulisan terbaca jelas saat diam
            const size = Math.min(Math.max(text.length * 1.5, 160), 260);
            balloon.style.width = `${size}px`;
            balloon.style.height = `${size}px`;

            // Dimunculkan di area tengah atas tombol (viewport tengah bawah) agar dramatis
            balloon.style.left = `${btnRect.left + (btnRect.width / 2)}px`;
            balloon.style.top = `${btnRect.top - 100}px`; 
            
            document.body.appendChild(balloon);

            // Memicu animasi baru berdurasi 8 detik
            balloon.style.animation = 'ascend 8s cubic-bezier(0.45, 0, 0.55, 1) forwards';

            prayerInput.value = "";

            // Efek konfeti meledak pelan saat balon baru saja terbentuk sempurna (detik ke-0.8)
            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    spread: 60,
                    origin: { 
                        x: (btnRect.left + (btnRect.width / 2)) / window.innerWidth, 
                        y: (btnRect.top - 100) / window.innerHeight 
                    },
                    colors: ['#e2c08d', '#ffffff', '#ffedbc'],
                    disableForced3d: true
                });
            }, 800);

            // Hapus elemen balon setelah 8 detik (saat sudah benar-benar hilang di atas layar)
            setTimeout(() => {
                balloon.remove();
            }, 8000);
        });
    </script>
</body>
</html>
